template:
  name: simplePipeline
  identifier: simplePipeline
  versionLabel: "1"
  type: Pipeline
  projectIdentifier: CSE_Lab_Project
  orgIdentifier: CSE_Labs
  tags: {}
  spec:
    stages:
      - stage:
          name: simpleStageFromFeatureBranch
          identifier: simpleStage
          tags: {}
          template:
            templateRef: simpleStage
            versionLabel: "1"
            gitBranch: feature/test-variable
      - stage:
          name: simpleBuild
          identifier: simpleBuild
          template:
            templateRef: simpleBuildStage
            versionLabel: "1"
            templateInputs:
              type: CI
              spec:
                infrastructure:
                  type: VM
                  spec:
                    type: Pool
                    spec:
                      poolName: <+input>
                      harnessImageConnectorRef: <+input>
      - stage:
          name: build
          identifier: build
          description: ""
          type: CI
          spec:
            cloneCodebase: false
            caching:
              enabled: true
              override: false
            infrastructure:
              type: KubernetesDirect
              spec:
                connectorRef: account.testeksconnector
                namespace: austin-test-ns
                automountServiceAccountToken: true
                nodeSelector: {}
                os: Linux
            execution:
              steps:
                - step:
                    type: Run
                    name: Run_1
                    identifier: Run_1
                    spec:
                      connectorRef: account.AT_Docker
                      image: library/nginx
                      shell: Sh
                      command: echo "hello world"
