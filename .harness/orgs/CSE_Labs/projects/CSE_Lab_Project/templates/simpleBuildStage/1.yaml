template:
  name: simpleBuildStage
  identifier: simpleBuildStage
  versionLabel: "1"
  type: Stage
  projectIdentifier: CSE_Lab_Project
  orgIdentifier: CSE_Labs
  tags: {}
  spec:
    type: CI
    spec:
      cloneCodebase: false
      caching:
        enabled: false
        override: false
        paths: []
      buildIntelligence:
        enabled: false
      infrastructure:
        type: VM
        spec:
          type: Pool
          spec:
            poolName: ""
            harnessImageConnectorRef: <+input>
            os: Linux
      execution:
        steps:
          - step:
              type: Run
              name: Run_1
              identifier: Run_1
              spec:
                connectorRef: account.AT_Docker
                image: library/nginx
                shell: Sh
                command: echo "Pulled from master-copy"
          - step:
              name: Run_2
              identifier: Run_2
              template:
                templateRef: simpleRunStepTemplate
                versionLabel: "1"
