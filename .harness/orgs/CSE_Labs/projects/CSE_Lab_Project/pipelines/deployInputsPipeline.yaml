pipeline:
  name: deployInputsPipeline
  identifier: deployInputsPipeline
  tags: {}
  template:
    templateRef: deployInputs
    versionLabel: "1"
    templateInputs:
      stages:
        - stage:
            identifier: deploy
            template:
              templateInputs:
                type: Deployment
                spec:
                  environment:
                    environmentRef: <+input>
